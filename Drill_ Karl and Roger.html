<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6F8C">
<title>Drill: Karl and Roger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8EFED;--surface:#FFFFFF;--surface2:#F2F6F5;--ink:#122229;--muted:#506A73;--line:#CBD9D6;
  --court:#2F6F8C;--kitchen:#3B819E;--surround:#3B7255;--net:#0F2A35;--ball:#E9D433;
  --p0:#FFFFFF;--p1:#FF7A9A;--accent:#1F5F7A;--good:#2E8B57;
  --cat-warm:#7FB59A;--cat-reset:#2F6F8C;--cat-lob:#E9D433;--cat-game:#FF7A9A;--cat-cool:#9BB0B6;--cat-extra:#B9A5E0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C23;--surface:#152830;--surface2:#1B323B;--ink:#E5EEF0;--muted:#92AAB1;--line:#28434C;
    --court:#285F79;--kitchen:#2F6E88;--surround:#2C5942;--accent:#83C7DF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C23;--surface:#152830;--surface2:#1B323B;--ink:#E5EEF0;--muted:#92AAB1;--line:#28434C;
  --court:#285F79;--kitchen:#2F6E88;--surround:#2C5942;--accent:#83C7DF;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,sans-serif;padding-bottom:92px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{flex:1;min-width:0}
.brand h1{font:700 30px/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center}

/* timer bar */
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:19;background:var(--net);color:#fff}
.timerbar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.timerbar .tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;opacity:.85}
.timerbar .tleft{font:700 28px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.timerbar button{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:8px 12px;color:#fff;min-height:40px}
.timerbar.done{background:var(--ball);color:var(--net)}
.timerbar.done button{background:rgba(0,0,0,.12);color:var(--net)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:12px 4px 14px;font-weight:600;color:var(--muted);min-height:58px;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--court)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--ball);color:var(--net);font-size:12px;line-height:20px}

/* drills tab */
.hint{margin:14px 0 6px;color:var(--muted);font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2.cat{font:700 22px/1.1 "Barlow Condensed",sans-serif;margin:22px 0 8px}
.drill{position:relative;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--catc,var(--line));border-radius:6px 14px 14px 6px;margin:0 0 10px}
.drill.done{opacity:.6}
.dhead{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 60px 12px 14px}
.dtitle{display:block;font-weight:600;font-size:18px;line-height:1.25}
.dmeta{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 4px}
.tag{font-size:13px;padding:1px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.who{background:transparent;border:1px solid var(--line)}
.dsum{display:block;color:var(--muted);font-size:15px}
.star{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:22px;line-height:1;color:var(--muted)}
.star.on{background:var(--ball);border-color:var(--ball);color:var(--net)}
.pickers{position:absolute;right:12px;top:58px;display:flex;gap:3px}
.pk{width:20px;height:20px;border-radius:50%;font:700 11px/20px "Barlow",sans-serif;text-align:center;color:var(--net)}
.pk.K{background:var(--p0);border:1px solid var(--muted)}
.pk.R{background:var(--p1)}
.dbody{padding:0 14px 14px}
.diag{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:14px;align-items:start;margin-bottom:6px}
@media (max-width:380px){.diag{grid-template-columns:1fr}.diag .courtbox{max-width:190px}}
.courtbox{position:relative}
.court{width:100%;height:auto;display:block;border-radius:8px}
.play{margin-top:6px;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px;font-weight:600;min-height:40px}
.legend{font-size:14px;color:var(--muted);margin:0 0 6px}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid var(--net)}
.dbody h3{font:700 18px/1.2 "Barlow Condensed",sans-serif;margin:14px 0 4px}
.dbody ul{margin:0;padding-left:20px}
.dbody li{margin:3px 0}
.vids a{display:block;padding:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}

/* picks tab */
.section{margin:18px 0}
.section h2{font:700 22px/1.1 "Barlow Condensed",sans-serif;margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:8px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600}
.row .rt span{color:var(--muted);font-size:14px}
.row input{width:26px;height:26px;accent-color:var(--court)}
.row.done .rt b{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px;font:inherit}
.sum{font-size:15px;color:var(--muted);margin:4px 0 0}

/* score tab */
.modes{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.board{position:relative;border-radius:16px;overflow:hidden;border:4px solid #fff;background:var(--surround);box-shadow:0 0 0 1px var(--line)}
.side{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;align-items:end;width:100%;border:0;color:#fff;text-align:left;padding:14px 18px;min-height:180px;position:relative}
.side0{background:var(--court)}
.side1{background:var(--kitchen)}
.side .role{grid-column:1;font-size:15px;opacity:.85;align-self:start}
.side .nm{grid-column:1;font:700 34px/1 "Barlow Condensed",sans-serif;align-self:start}
.side .num{grid-column:2;grid-row:1 / span 2;font:700 120px/.85 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.side .tg{grid-column:1;font-size:15px;opacity:.85}
.side.lead .num{color:var(--ball)}
.side:active{filter:brightness(1.1)}
.netline{height:6px;background:repeating-linear-gradient(90deg,#fff 0 6px,var(--net) 6px 12px)}
.sidectl{display:flex;gap:8px;padding:8px 10px;background:rgba(0,0,0,.18)}
.sidectl button{flex:1;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;padding:8px;font-weight:600;min-height:40px}
.over{position:absolute;inset:0;background:rgba(15,42,53,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.over h2{font:700 44px/1 "Barlow Condensed",sans-serif;margin:0;color:var(--ball)}
.over p{margin:0;font-size:18px}
.over .btn{background:#fff;color:var(--net);border:0}
.over .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.toggle{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--court)}
.rule{color:var(--muted);font-size:15px;margin:8px 0 0}
.hist li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none}
.hist{padding:0;margin:0}
.hist small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Drill</h1>
      <p>Karl and Roger, 7:15 AM</p>
    </div>
    <div class="seg" role="group" aria-label="I am">
      <button data-me="Karl">Karl</button>
      <button data-me="Roger">Roger</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark">◐</button>
  </div>
</header>

<div class="timerbar" id="timerbar" hidden>
  <div class="wrap">
    <span class="tleft">0:00</span>
    <span class="tl"></span>
    <button data-timer="add">+1 min</button>
    <button data-timer="stop">Stop</button>
  </div>
</div>

<main class="wrap">
  <section id="tab-drills">
    <p class="hint">Star anything you want to do. No fixed order. If you want a shape: warm up, one reset drill for Karl, one lob drill for Roger, then play 7-Eleven until you're done.</p>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
  <section id="tab-picks" hidden></section>
  <section id="tab-score" hidden></section>
</main>

<nav class="tabs" role="tablist">
  <div class="wrap">
    <button role="tab" data-tab="drills" aria-selected="true">Drills</button>
    <button role="tab" data-tab="picks" aria-selected="false">Our picks <span class="badge" id="pickCount">0</span></button>
    <button role="tab" data-tab="score" aria-selected="false">Score</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('drill-data').textContent);
const DRILLS = DATA.drills, CATS = DATA.categories, MODES = DATA.modes;
const byId = Object.fromEntries(DRILLS.map(d => [d.id, d]));
const NAMES = {K:'Karl', R:'Roger'};
const KEY = 'drill93:v1';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEF = {me:'Karl', picks:{Karl:[],Roger:[]}, done:[], notes:'', score:null, games:[], timer:null, theme:null, filter:'all'};
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) { S = Object.assign({}, DEF); }
S.picks = Object.assign({Karl:[],Roger:[]}, S.picks || {});
if (!Array.isArray(S.done)) S.done = [];
if (!Array.isArray(S.games)) S.games = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* theme */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').addEventListener('click', () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
});
applyTheme();

/* who am I */
function renderMe(){ document.querySelectorAll('[data-me]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.me === S.me))); }

/* court svg */
let uid = 0;
function lobCtrl(p){ return [(p.a[0]+p.b[0])/2 - 4.5, (p.a[1]+p.b[1])/2]; }
function courtSVG(d){
  const id = 'ah' + (++uid);
  let s = `<svg class="court" viewBox="-2 -2 24 48" role="img" aria-label="Court diagram">`;
  s += `<defs><marker id="${id}" viewBox="0 0 4 4" refX="3" refY="2" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L4,2 L0,4z" fill="#fff"/></marker></defs>`;
  s += `<rect x="-2" y="-2" width="24" height="48" fill="var(--surround)"/>`;
  s += `<rect x="0" y="0" width="20" height="44" fill="var(--court)"/>`;
  s += `<rect x="0" y="15" width="20" height="14" fill="var(--kitchen)"/>`;
  (d.zones||[]).forEach(z => { s += `<rect x="${z[0]}" y="${z[1]}" width="${z[2]}" height="${z[3]}" fill="var(--ball)" opacity=".32"/>`; });
  s += `<g stroke="#fff" stroke-width=".22" fill="none"><rect x="0" y="0" width="20" height="44"/><line x1="0" y1="15" x2="20" y2="15"/><line x1="0" y1="29" x2="20" y2="29"/><line x1="10" y1="0" x2="10" y2="15"/><line x1="10" y1="29" x2="10" y2="44"/></g>`;
  s += `<line x1="-1" y1="22" x2="21" y2="22" stroke="var(--net)" stroke-width=".55"/>`;
  (d.paths||[]).forEach(p => {
    const common = `stroke-width=".28" fill="none" marker-end="url(#${id})" stroke-linecap="round"`;
    if (p.t === 'lob') { const c = lobCtrl(p); s += `<path d="M${p.a[0]},${p.a[1]} Q${c[0]},${c[1]} ${p.b[0]},${p.b[1]}" stroke="var(--ball)" ${common}/>`; }
    else s += `<line x1="${p.a[0]}" y1="${p.a[1]}" x2="${p.b[0]}" y2="${p.b[1]}" stroke="rgba(255,255,255,.9)" ${common} ${p.t==='feed'?'stroke-dasharray=".7 .5"':''}/>`;
  });
  (d.moves||[]).forEach(m => {
    const pts = dedupe(m.pts); if (pts.length < 2) return;
    s += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" stroke="rgba(255,255,255,.55)" stroke-width=".22" stroke-dasharray=".35 .35" fill="none" marker-end="url(#${id})"/>`;
  });
  s += `<circle class="ball" r=".6" cx="-10" cy="-10" fill="var(--ball)" stroke="var(--net)" stroke-width=".12" opacity="0"/>`;
  (d.players||[]).forEach(p => {
    s += `<g data-who="${p.l}" data-x="${p.x}" data-y="${p.y}" transform="translate(${p.x} ${p.y})"><circle r="1.35" fill="var(--p${p.c})" stroke="var(--net)" stroke-width=".22"/><text y=".5" text-anchor="middle" font-size="1.45" font-weight="700" font-family="Barlow, sans-serif" fill="#122229">${p.l}</text></g>`;
  });
  return s + `</svg>`;
}
function dedupe(pts){ return pts.filter((p,i) => i === 0 || p[0] !== pts[i-1][0] || p[1] !== pts[i-1][1]); }
function pathPoint(p, u){
  const [ax,ay] = p.a, [bx,by] = p.b;
  if (p.t === 'lob'){ const [cx,cy] = lobCtrl(p); const v = 1-u; return [v*v*ax + 2*v*u*cx + u*u*bx, v*v*ay + 2*v*u*cy + u*u*by]; }
  return [ax + (bx-ax)*u, ay + (by-ay)*u];
}
function polyPoint(pts, u){
  // pts are evenly spaced keyframes in time (repeated points mean "hold")
  if (pts.length === 1) return pts[0];
  const f = Math.min(Math.max(u,0),1) * (pts.length - 1), i = Math.min(Math.floor(f), pts.length - 2), k = f - i;
  return [pts[i][0] + (pts[i+1][0]-pts[i][0])*k, pts[i][1] + (pts[i+1][1]-pts[i][1])*k];
}
function animate(svg, d){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const paths = d.paths || [], moves = d.moves || [], STEP = 900;
  const T = Math.max(paths.length * STEP, 1200);
  const ball = svg.querySelector('.ball');
  const groups = {}; svg.querySelectorAll('[data-who]').forEach(g => groups[g.dataset.who] = g);
  const t0 = performance.now();
  function frame(now){
    const t = reduce ? T : Math.min(now - t0, T);
    if (paths.length){
      const i = Math.min(Math.floor(t / STEP), paths.length - 1), u = Math.min((t - i*STEP) / STEP, 1), p = paths[i];
      const [x,y] = pathPoint(p, u);
      ball.setAttribute('cx', x); ball.setAttribute('cy', y);
      ball.setAttribute('r', p.t === 'lob' ? (0.6 + 0.8*Math.sin(Math.PI*u)).toFixed(3) : 0.6);
      ball.setAttribute('opacity', 1);
    }
    moves.forEach(m => { const g = groups[m.who]; if (!g) return; const [x,y] = polyPoint(m.pts, t / T); g.setAttribute('transform', `translate(${x} ${y})`); });
    if (t < T) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* drills list */
let openId = null;
function pickedBy(id){ return ['Karl','Roger'].filter(n => S.picks[n].includes(id)); }
function renderFilters(){
  const opts = [{id:'all', name:'All'}].concat(CATS);
  $('#filters').innerHTML = opts.map(c => `<button class="chip" data-filter="${c.id}" aria-pressed="${S.filter===c.id}">${esc(c.name)}</button>`).join('');
}
function cardHTML(d){
  const mine = S.picks[S.me].includes(d.id), by = pickedBy(d.id), done = S.done.includes(d.id);
  return `<article class="drill${done?' done':''}" id="d-${d.id}" style="--catc:var(--cat-${d.cat})">
    <button class="dhead" data-open="${d.id}" aria-expanded="${openId===d.id}">
      <span class="dtitle">${esc(d.title)}</span>
      <span class="dmeta"><span class="tag">${d.mins} min</span><span class="tag who">For ${esc(d.forWho)}</span>${d.scoring?'<span class="tag">Scored</span>':''}${done?'<span class="tag">Done</span>':''}</span>
      <span class="dsum">${esc(d.summary)}</span>
    </button>
    <button class="star${mine?' on':''}" data-pick="${d.id}" aria-pressed="${mine}" aria-label="${mine?'Unpick':'Pick'} ${esc(d.title)}">★</button>
    ${by.length?`<span class="pickers" aria-label="Picked by ${by.join(' and ')}">${by.map(n=>`<span class="pk ${n[0]}">${n[0]}</span>`).join('')}</span>`:''}
    ${openId===d.id ? bodyHTML(d) : ''}
  </article>`;
}
function bodyHTML(d){
  const legend = Object.entries(d.who||{}).map(([k,v]) => `<span class="dot" style="background:var(--p${k==='K'?0:1})"></span><b>${k}</b> ${NAMES[k]}: ${esc(v)}`).join('<br>');
  return `<div class="dbody">
    <div class="diag">
      <div class="courtbox">${courtSVG(d.diagram)}<button class="play" data-play="${d.id}">Play</button></div>
      <div>
        <p class="legend">${legend}<br>Swap roles any time.</p>
        <h3>How it works</h3><ul>${d.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      </div>
    </div>
    ${d.cues.length?`<h3>Cues</h3><ul>${d.cues.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
    ${d.videos.length?`<h3>Videos</h3><div class="vids">${d.videos.map(v=>`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.label)}</a>`).join('')}</div>`:''}
    <div class="actions">
      <button class="btn primary" data-start="${d.id}">Start ${d.mins} min timer</button>
      ${d.scoring?`<button class="btn" data-scoreit="${d.scoring}">Keep score</button>`:''}
      <button class="btn" data-done="${d.id}">${S.done.includes(d.id)?'Mark not done':'Mark done'}</button>
    </div>
  </div>`;
}
function renderList(){
  const cats = S.filter === 'all' ? CATS : CATS.filter(c => c.id === S.filter);
  $('#list').innerHTML = cats.map(c => {
    const ds = DRILLS.filter(d => d.cat === c.id); if (!ds.length) return '';
    return `<h2 class="cat">${esc(c.name)}</h2>` + ds.map(cardHTML).join('');
  }).join('');
}

/* picks */
function renderPicks(){
  const k = S.picks.Karl, r = S.picks.Roger;
  const both = k.filter(id => r.includes(id));
  const kOnly = k.filter(id => !both.includes(id)), rOnly = r.filter(id => !both.includes(id));
  const all = [...new Set([...k, ...r])];
  const mins = all.reduce((a,id) => a + (byId[id] ? byId[id].mins : 0), 0);
  const left = all.filter(id => !S.done.includes(id)).reduce((a,id) => a + byId[id].mins, 0);
  const row = id => { const d = byId[id]; if (!d) return ''; const done = S.done.includes(id);
    return `<div class="row${done?' done':''}"><input type="checkbox" data-done="${id}" ${done?'checked':''} aria-label="Done: ${esc(d.title)}"><div class="rt"><b>${esc(d.title)}</b><span>${d.mins} min, for ${esc(d.forWho)}</span></div><button class="btn" data-goto="${id}">Open</button></div>`; };
  const sec = (title, ids, empty) => `<div class="section"><h2>${title}</h2>${ids.length ? ids.map(row).join('') : `<p class="empty">${empty}</p>`}</div>`;
  $('#tab-picks').innerHTML = `
    <div class="section"><p class="sum">${all.length ? `${all.length} drills picked, about ${mins} min total, ${left} min left.` : 'Nothing picked yet. Tap the star on any drill.'}</p>
      <div class="actions"><button class="btn primary" data-share>Send my picks to ${S.me==='Karl'?'Roger':'Karl'}</button>${S.done.length?'<button class="btn" data-cleardone>Clear done marks</button>':''}</div>
      <p class="rule">Picks stay on this phone. Sending makes a link; when the other person opens it, your picks show up on their phone too.</p>
    </div>
    ${sec('Both picked', both, 'Nothing in common yet.')}
    ${sec("Karl's picks", kOnly, 'Karl has no other picks.')}
    ${sec("Roger's picks", rOnly, "Roger's picks show up here after he sends them.")}
    <div class="section"><h2>Notes for next time</h2><textarea id="notes" placeholder="One thing each to bring next time">${esc(S.notes)}</textarea></div>`;
  $('#pickCount').textContent = all.length;
}

/* scoreboard */
function newGame(mode, names){
  const m = MODES[mode];
  S.score = {mode, names: names || m.defaultNames.slice(), scores: m.sides.map(x => x.start || 0), hist: [], lobs: false, over: null};
  save(); renderScore();
}
function winnerOf(sc){
  const m = MODES[sc.mode];
  for (let i = 0; i < 2; i++){
    const me = sc.scores[i], other = sc.scores[1-i], t = m.sides[i].target;
    if (me >= t && (!m.winBy || me - other >= m.winBy)) return i;
  }
  return null;
}
function point(i, delta){
  const sc = S.score; if (!sc || sc.over !== null) return;
  sc.hist.push(sc.scores.slice());
  if (delta === 'net') sc.scores[i] = 0; else sc.scores[i] = Math.max(0, sc.scores[i] + delta);
  const w = winnerOf(sc);
  if (w !== null){
    sc.over = w;
    const m = MODES[sc.mode];
    S.games.unshift({mode: sc.mode, names: sc.names.slice(), roles: m.sides.map(x => x.role), scores: sc.scores.slice(), winner: w, lobs: !!sc.lobs, at: Date.now()});
    S.games = S.games.slice(0, 50);
    try { navigator.vibrate && navigator.vibrate([80,60,160]); } catch(e) {}
  } else { try { navigator.vibrate && navigator.vibrate(25); } catch(e) {} }
  save(); renderScore();
}
function undo(){
  const sc = S.score; if (!sc || !sc.hist.length) return;
  if (sc.over !== null){ sc.over = null; S.games.shift(); }
  sc.scores = sc.hist.pop(); save(); renderScore();
}
function renderScore(){
  if (!S.score) { S.score = null; newGame('seven11'); return; }
  const sc = S.score, m = MODES[sc.mode];
  const lead = sc.scores[0] === sc.scores[1] ? -1 : (sc.scores[0]/m.sides[0].target > sc.scores[1]/m.sides[1].target ? 0 : 1);
  const side = i => `
    <button class="side side${i}${lead===i?' lead':''}" data-pt="${i}" aria-label="Point for ${esc(sc.names[i])}">
      <span class="role">${esc(m.sides[i].role)}</span>
      <span class="nm">${esc(sc.names[i])}</span>
      <span class="num">${sc.scores[i]}</span>
      <span class="tg">to ${m.sides[i].target}${m.winBy?', win by '+m.winBy:''}</span>
    </button>
    ${m.netReset || m.minus ? `<div class="sidectl">${m.netReset?`<button data-net="${i}">Net: back to 0</button>`:''}${m.minus?`<button data-minus="${i}">Called and lost: -1</button>`:''}</div>`:''}`;
  const w = sc.over;
  const recent = S.games.slice(0, 12);
  $('#tab-score').innerHTML = `
    <div class="modes">${Object.entries(MODES).map(([k,v]) => `<button class="chip" data-mode="${k}" aria-pressed="${sc.mode===k}">${esc(v.name)}</button>`).join('')}</div>
    <div class="board">
      ${side(0)}<div class="netline" aria-hidden="true"></div>${side(1)}
      ${w !== null ? `<div class="over" role="dialog" aria-label="Game over"><h2>${esc(sc.names[w])} wins</h2><p>${esc(m.name)}: ${sc.scores[w]} to ${sc.scores[1-w]}</p><button class="btn" data-rematch>Rematch, swap roles</button><button class="btn ghost" data-undo>Undo last point</button></div>` : ''}
    </div>
    <div class="ctl">
      <button class="btn" data-undo ${sc.hist.length?'':'disabled'}>Undo</button>
      <button class="btn" data-swap>Swap roles</button>
      <button class="btn" data-reset>New game</button>
    </div>
    ${m.lobsToggle ? `<label class="toggle"><input type="checkbox" data-lobs ${sc.lobs?'checked':''}> Lobs allowed this game</label>` : ''}
    <p class="rule">${esc(m.rule)} Tap a side to give it the point.</p>
    <div class="section"><h2>Games today</h2>${recent.length ? `<ul class="hist">${recent.map(g => {
      const mm = MODES[g.mode] || {name:g.mode};
      const t = new Date(g.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
      return `<li><b>${esc(g.names[g.winner])}</b> won ${esc(mm.name)}, ${g.scores[g.winner]} to ${g.scores[1-g.winner]}<br><small>${esc(g.names[0])} (${esc(g.roles[0])}) vs ${esc(g.names[1])} (${esc(g.roles[1])})${g.mode==='seven11'?(g.lobs?', lobs on':', lobs off'):''}, ${t}</small></li>`;
    }).join('')}</ul><div class="actions"><button class="btn" data-clearhist>Clear game history</button></div>` : '<p class="empty">Finished games land here.</p>'}</div>`;
}

/* timer */
let tick = null, wake = null, beeped = false;
function beep(){ try { const A = window.AudioContext || window.webkitAudioContext; const ctx = new A(); [0, .35].forEach(off => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.25, ctx.currentTime + off); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + off + .3); o.start(ctx.currentTime + off); o.stop(ctx.currentTime + off + .3); }); } catch(e) {} }
async function lockWake(){ try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch(e) {} }
function releaseWake(){ try { wake && wake.release(); } catch(e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (S.timer && document.visibilityState === 'visible') lockWake(); });
function startTimer(mins, label){ S.timer = {end: Date.now() + mins*60000, label}; beeped = false; save(); runTimer(); lockWake(); }
function runTimer(){
  clearInterval(tick); const bar = $('#timerbar');
  if (!S.timer){ bar.hidden = true; releaseWake(); return; }
  bar.hidden = false; $('.tl', bar).textContent = S.timer.label;
  const upd = () => {
    if (!S.timer) return;
    const left = S.timer.end - Date.now();
    if (left <= 0){ $('.tleft', bar).textContent = 'Time'; bar.classList.add('done'); if (!beeped){ beeped = true; beep(); try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e) {} } return; }
    bar.classList.remove('done');
    const m = Math.floor(left/60000), s = Math.floor(left % 60000 / 1000);
    $('.tleft', bar).textContent = `${m}:${String(s).padStart(2,'0')}`;
  };
  upd(); tick = setInterval(upd, 500);
}

/* tabs */
function showTab(t){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['drills','picks','score'].forEach(x => $('#tab-' + x).hidden = x !== t);
  if (t === 'picks') renderPicks();
  if (t === 'score') renderScore();
  window.scrollTo(0, 0);
}

/* sharing picks without a server: encode them in a link */
async function sharePicks(){
  const ids = S.picks[S.me];
  if (!ids.length){ toast('Star a few drills first.'); return; }
  const url = location.origin + location.pathname + location.search + '#from=' + S.me + '&picks=' + ids.join(',');
  const text = `${S.me}'s drill picks: ${ids.map(i => byId[i].title).join(', ')}`;
  try { if (navigator.share){ await navigator.share({title:'Drill picks', text, url}); return; } } catch(e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + '\n' + url); toast('Link copied. Text it over.'); } catch(e) { window.prompt('Copy this link', url); }
}
function importFromHash(){
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1)), from = h.get('from'), p = h.get('picks');
  if (!['Karl','Roger'].includes(from) || p === null) return;
  const ids = p.split(',').filter(id => byId[id]);
  S.picks[from] = ids; save();
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  toast(`Loaded ${from}'s picks (${ids.length})`);
}
window.addEventListener('hashchange', () => { importFromHash(); renderAll(); });

/* events */
document.addEventListener('click', e => {
  const t = e.target.closest('button, input[type="checkbox"]'); if (!t) return;
  const ds = t.dataset;
  if (ds.me){ S.me = ds.me; save(); renderMe(); renderList(); if (!$('#tab-picks').hidden) renderPicks(); }
  else if (ds.tab) showTab(ds.tab);
  else if (ds.filter){ S.filter = ds.filter; save(); renderFilters(); renderList(); }
  else if (ds.open){ openId = openId === ds.open ? null : ds.open; renderList(); if (openId) $('#d-' + openId).scrollIntoView({block:'nearest'}); }
  else if (ds.pick){ const arr = S.picks[S.me], i = arr.indexOf(ds.pick); if (i >= 0) arr.splice(i,1); else arr.push(ds.pick); save(); renderList(); renderPicks(); }
  else if (ds.play){ const card = $('#d-' + ds.play); animate($('svg', card), byId[ds.play].diagram); t.textContent = 'Replay'; }
  else if (ds.start){ const d = byId[ds.start]; startTimer(d.mins, d.title); toast(`${d.mins} min timer started`); }
  else if (ds.scoreit){ newGame(ds.scoreit); showTab('score'); }
  else if (ds.done){ const i = S.done.indexOf(ds.done); if (i >= 0) S.done.splice(i,1); else S.done.push(ds.done); save(); renderList(); renderPicks(); }
  else if (ds.goto !== undefined){ openId = ds.goto; S.filter = 'all'; save(); showTab('drills'); renderFilters(); renderList(); const c = $('#d-' + openId); c && c.scrollIntoView({block:'start'}); }
  else if (ds.share !== undefined) sharePicks();
  else if (ds.cleardone !== undefined){ S.done = []; save(); renderList(); renderPicks(); }
  else if (ds.timer === 'stop'){ S.timer = null; save(); runTimer(); }
  else if (ds.timer === 'add'){ if (S.timer){ S.timer.end = Math.max(S.timer.end, Date.now()) + 60000; beeped = false; save(); runTimer(); } }
  else if (ds.mode){ newGame(ds.mode); }
  else if (ds.pt !== undefined) point(+ds.pt, 1);
  else if (ds.net !== undefined) point(+ds.net, 'net');
  else if (ds.minus !== undefined) point(+ds.minus, -1);
  else if (ds.undo !== undefined) undo();
  else if (ds.swap !== undefined){ const sc = S.score; newGame(sc.mode, [sc.names[1], sc.names[0]]); }
  else if (ds.rematch !== undefined){ const sc = S.score; const lobs = sc.lobs; newGame(sc.mode, [sc.names[1], sc.names[0]]); S.score.lobs = lobs; save(); renderScore(); }
  else if (ds.reset !== undefined){ const sc = S.score; newGame(sc.mode, sc.names); }
  else if (ds.lobs !== undefined){ S.score.lobs = t.checked; save(); }
  else if (ds.clearhist !== undefined){ if (confirm('Clear all saved games?')){ S.games = []; save(); renderScore(); } }
});
document.addEventListener('input', e => { if (e.target.id === 'notes'){ S.notes = e.target.value; save(); } });

function renderAll(){ renderMe(); renderFilters(); renderList(); renderPicks(); }
importFromHash();
renderAll();
runTimer();
if (S.timer) lockWake();
})();
</script>
</body>
</html>
